<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Career Navigator</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#0f1a33;--mu:#5b6785;--bd:#dfe4f0;--ac:#5b5bf0;--ac2:#7c5cff;--ok:#0f7a56;--wn:#9a5b00;--nav:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1128;--card:#121b3a;--tx:#eef1fb;--mu:#9aa6c8;--bd:#25305c;--ac:#7c86ff;--ac2:#9b7cff;--ok:#4fd1a0;--wn:#f0b454;--nav:#0d1631;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1128;--card:#121b3a;--tx:#eef1fb;--mu:#9aa6c8;--bd:#25305c;--ac:#7c86ff;--ac2:#9b7cff;--ok:#4fd1a0;--wn:#f0b454;--nav:#0d1631;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--nav);z-index:10}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--nav);border-bottom:1px solid var(--bd);display:flex;gap:4px;align-items:center;padding:8px 12px;overflow-x:auto}
nav b{display:flex;align-items:center;gap:6px;margin-right:8px;white-space:nowrap;cursor:pointer}
nav a{padding:6px 10px;border-radius:8px;color:var(--mu);cursor:pointer;white-space:nowrap;font-size:14px}
nav a.on{background:var(--bd);color:var(--tx)}
.w{max-width:960px;margin:0 auto;padding:16px}
h1,h2,h3{line-height:1.2;margin:.2em 0 .5em}
.mu{color:var(--mu);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.btn{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0;border-radius:10px;padding:10px 16px;font:600 15px inherit;font-family:inherit;cursor:pointer}
.btn.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-block;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:4px 10px;margin:2px;font:13px inherit;font-family:inherit;cursor:pointer}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.chip.ok{color:var(--ok);border-color:var(--ok);cursor:default}.chip.no{color:var(--wn);border-color:var(--wn);cursor:default}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.hero{background:linear-gradient(160deg,#0a1128,#232a7a);color:#fff;border-radius:18px;padding:36px 18px;text-align:center;margin-bottom:16px}
.hero p{max-width:560px;margin:0 auto 18px;color:#cdd5f5}
.hero .btn.g{color:#fff;border-color:#5f6bb5}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:16px inherit;font-family:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.err{color:#d33;font-size:13px;margin-top:4px}
.msgs{height:min(55vh,520px);overflow-y:auto;padding:8px;border:1px solid var(--bd);border-radius:14px;background:var(--card);margin-bottom:8px}
.m{max-width:88%;padding:9px 12px;border-radius:12px;margin:6px 0;font-size:15px;line-height:1.5;overflow-wrap:anywhere}
.m.u{background:var(--ac);color:#fff;margin-left:auto}.m.a{background:var(--bg);border:1px solid var(--bd)}.m.e{border:1px solid #d33}
code{background:var(--bd);padding:1px 4px;border-radius:4px}
dialog{max-width:620px;width:calc(100% - 24px);max-height:85vh;border:1px solid var(--bd);border-radius:16px;background:var(--card);color:var(--tx);padding:18px}
dialog::backdrop{background:rgba(5,10,30,.6)}
.tk{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:15px}.tk input{width:auto;margin-top:5px}
</style></head><body>
<nav id="nav"></nav>
<main id="app" class="w"></main>
<dialog id="dlg"></dialog>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const INT={ai:"AI/ML",data:"Data",web:"Web",cloud:"Cloud",security:"Security",business:"Business",finance:"Finance",product:"Product"};
const C=[
{id:"ai",n:"AI Engineer",c:"Data & AI",l:"Intermediate",i:["ai"],s:["python","machine learning","apis","deep learning","git"],o:["llms","mlops","cloud"],t:["Junior AI Engineer","AI Developer","ML Intern"],pr:["Chatbot using an LLM API","Image classifier web app"],d:"Builds applications that use machine learning models and AI APIs."},
{id:"ml",n:"Machine Learning Engineer",c:"Data & AI",l:"Advanced",i:["ai","data"],s:["python","statistics","machine learning","scikit-learn","sql"],o:["pytorch","mlops","docker"],t:["Junior ML Engineer","Data Science Intern"],pr:["End-to-end model served by an API","Recommendation system"],d:"Trains, evaluates and deploys machine learning models."},
{id:"ds",n:"Data Scientist",c:"Data & AI",l:"Intermediate",i:["data","ai"],s:["python","statistics","sql","pandas","machine learning"],o:["deep learning","a/b testing"],t:["Junior Data Scientist","Data Analyst"],pr:["Churn prediction","Insights report with charts"],d:"Finds patterns in data and builds models to support decisions."},
{id:"da",n:"Data Analyst",c:"Data & AI",l:"Beginner",i:["data","business"],s:["excel","sql","data visualization","statistics","python"],o:["power bi","tableau"],t:["Junior Data Analyst","Reporting Analyst","Analyst Intern"],pr:["Sales dashboard","Public dataset analysis"],d:"Cleans and analyses data, then explains findings with reports and dashboards."},
{id:"fs",n:"Full-Stack Developer",c:"Software",l:"Intermediate",i:["web"],s:["html","css","javascript","react","sql","git"],o:["typescript","docker","testing"],t:["Junior Web Developer","Frontend Intern"],pr:["Portfolio website","CRUD app with login"],d:"Builds both the user interface and the server side of web applications."},
{id:"cl",n:"Cloud / DevOps Engineer",c:"Infrastructure",l:"Intermediate",i:["cloud"],s:["linux","networking","git","docker","cloud basics"],o:["kubernetes","terraform","ci/cd"],t:["Cloud Support Associate","Junior DevOps Engineer"],pr:["Deploy an app with CI/CD","Containerize a project"],d:"Runs and automates the infrastructure that applications live on."},
{id:"sec",n:"Cybersecurity Analyst",c:"Security",l:"Intermediate",i:["security"],s:["networking","linux","security basics","python","owasp"],o:["siem","penetration testing"],t:["SOC Analyst (L1)","Security Intern"],pr:["Home lab with log monitoring","Vulnerability scan report"],d:"Monitors systems, detects threats and helps fix vulnerabilities."},
{id:"ba",n:"Business Analyst",c:"Business",l:"Beginner",i:["business","data"],s:["excel","sql","communication","requirements gathering","data visualization"],o:["power bi","agile"],t:["Junior Business Analyst","Operations Analyst"],pr:["Process-improvement case study","KPI dashboard"],d:"Connects business needs with data and technology teams."},
{id:"pm",n:"Product Manager",c:"Business",l:"Intermediate",i:["product","business"],s:["communication","user research","roadmapping","analytics","agile"],o:["sql","ux basics"],t:["Associate Product Manager","Product Intern"],pr:["Product teardown","Requirements doc for a student app"],d:"Decides what a product should do and works with teams to deliver it."},
{id:"fa",n:"Financial Analyst",c:"Finance",l:"Beginner",i:["finance","business"],s:["excel","accounting basics","financial modeling","communication","statistics"],o:["python","power bi"],t:["Junior Financial Analyst","FP&A Intern"],pr:["Three-statement model","Portfolio analysis"],d:"Analyses financial data to guide budgeting and investment decisions."}];
const ST=["1. Beginner stage","2. Core skills","3. Practical projects","4. Portfolio","5. Internship prep","6. Interview prep","7. Job applications"];
let S={p:null,done:{},chat:[],view:"home",rc:null},busy=0;
try{const x=JSON.parse(localStorage.getItem("acn")||"{}");S.p=x.p||null;S.done=x.done||{}}catch(e){}
const save=()=>{try{localStorage.setItem("acn",JSON.stringify({p:S.p,done:S.done}))}catch(e){}};
const AL={ml:"machine learning",js:"javascript",dl:"deep learning"};
const has=k=>(S.p?S.p.skills:[]).some(u=>u.length>1&&(k.includes(u)||u.includes(k)));
const split=c=>({got:c.s.filter(has),miss:c.s.filter(k=>!has(k))});
function score(c){const p=S.p,g=split(c).got,why=[g.length+" of "+c.s.length+" essential skills matched"];let sc=60*g.length/c.s.length;const im=c.i.filter(x=>p.int.includes(x));if(im.length){sc+=25;why.push("matches your interest in "+im.map(x=>INT[x]).join(", "))}if(p.target===c.id){sc+=15;why.push("it is your target role")}return{c,sc:Math.round(sc),why}}
const recs=()=>C.map(score).sort((a,b)=>b.sc-a.sc);
const cur=()=>C.find(c=>c.id===S.rc)||(S.p&&C.find(c=>c.id===S.p.target))||(S.p?recs()[0].c:C[0]);
const RM=c=>{const m=split(c).miss;return[["Learn the basics: "+(m[0]||c.s[0]),"Finish one beginner course or the official docs"],c.s.map(k=>"Practice: "+k),c.pr.map(x=>"Build: "+x),["Publish projects on GitHub with clear READMEs","Create a simple portfolio page"],["Write a truthful one-page resume","Apply to a few internships each week"],["Practice core concept questions","Do mock interviews with a friend"],["Target roles: "+c.t.join(", "),"Track applications and follow up"]]};
const prog=c=>{let t=0,d=0;RM(c).forEach((a,i)=>a.forEach((_,j)=>{t++;if(S.done[c.id+i+"_"+j])d++}));return[d,t]};
const bar=(d,t)=>`<div class="bar"><i style="width:${t?100*d/t:0}%"></i></div>`;
const chips=(a,f)=>a.map(x=>`<span class="chip ${f(x)}">${esc(x)}</span>`).join("")||'<span class="mu">None</span>';
const sel=(id,fn)=>`<select aria-label="Choose career" onchange="S.rc=this.value;V.${fn}()">${C.map(c=>`<option value="${c.id}" ${cur().id===c.id?"selected":""}>${c.n}</option>`).join("")}</select>`;
const nope=()=>{$("#app").innerHTML=`<div class="card"><h2>Create your profile first</h2><p class="mu">We use it to personalize recommendations.</p><button class="btn" onclick="go('onboard')">Get started</button></div>`};

const V={
home(){$("#app").innerHTML=`<div class="hero"><svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="25" fill="none" stroke="#9b7cff" stroke-width="3"/><path d="M28 10l8 20-8 16-8-16z" fill="#7c86ff"/></svg><h1>AI Career Navigator</h1><p>Personalized career guidance for Degree, B.Tech, MCA and MBA students: recommendations, roadmaps, skill gaps and an AI mentor in one place.</p><div class="row" style="justify-content:center"><button class="btn" onclick="go(S.p?'dash':'onboard')">Get Started</button><button class="btn g" onclick="go('explore')">Explore Careers</button></div></div><div class="grid">${[["🎯","Personalized matches","Transparent rule-based scoring, with the reasons shown."],["🧩","Skill-gap analysis","See your strengths and what to learn first."],["🗺️","Career roadmaps","Seven stages with progress tracking."],["💬","AI career mentor","Chat powered by Claude, aware of your profile."],["🔍","Career explorer","Search and filter ten career paths."],["📄","Resume guidance","Ask the mentor to review your structure. No invented facts."]].map(f=>`<div class="card"><div style="font-size:26px">${f[0]}</div><h3>${f[1]}</h3><p class="mu">${f[2]}</p></div>`).join("")}</div>`},
onboard(){ob.step=ob.step||0;const fs=F[ob.step],d=ob.d;$("#app").innerHTML=`<div class="card" style="max-width:560px;margin:auto"><p class="mu">Step ${ob.step+1} of 3 · no unnecessary personal data</p>${bar(ob.step+1,3)}<h2>${["About you","Skills & interests","Goals"][ob.step]}</h2>${fs.map(f=>fld(f,d)).join("")}<div class="row" style="margin-top:16px">${ob.step?'<button class="btn g" onclick="nextStep(-1)">Back</button>':""}<button class="btn" onclick="nextStep(1)">${ob.step==2?"Finish":"Next"}</button></div></div>`},
dash(){if(!S.p)return nope();const p=S.p,r=recs().slice(0,3),t=r[0].c,[d,n]=prog(t);$("#app").innerHTML=`<h2>Welcome${p.name?", "+esc(p.name):""} 👋</h2><div class="card"><b>${esc(p.qual)} · ${esc(p.course)}</b> <span class="mu">· ${esc(p.year)} year · ${esc(p.lvl)} · ${p.hrs} h/week${p.loc?" · "+esc(p.loc):""}</span><div>${p.int.map(x=>`<span class="chip">${INT[x]}</span>`).join("")}</div><button class="btn g" style="margin-top:8px" onclick="go('onboard')">Edit profile</button></div><h3>Recommended careers</h3><p class="mu">Rule-based match scores (skills, interests, target role). They are guides, not predictions.</p><div class="grid">${r.map(x=>card(x)).join("")}</div><div class="grid" style="margin-top:12px"><div class="card"><h3>Skill gaps for ${t.n}</h3>${chips(split(t).miss,()=>"no")}<br><button class="btn g" onclick="S.rc='${t.id}';go('gap')">Full analysis</button></div><div class="card"><h3>Roadmap progress</h3><p class="mu">${d} of ${n} tasks done</p>${bar(d,n)}<button class="btn g" onclick="S.rc='${t.id}';go('road')">Open roadmap</button></div><div class="card"><h3>Suggested projects</h3><ul>${t.pr.map(x=>`<li>${x}</li>`).join("")}</ul><button class="btn" onclick="go('chat')">Ask the AI mentor</button></div></div>`},
explore(){const cats=[...new Set(C.map(c=>c.c))];$("#app").innerHTML=`<h2>Career explorer</h2><div class="row"><input id="fq" placeholder="Search careers or skills" style="flex:2;min-width:160px" oninput="fx()"><select id="fc" style="flex:1" onchange="fx()"><option value="">All categories</option>${cats.map(c=>`<option>${c}</option>`).join("")}</select><select id="fl" style="flex:1" onchange="fx()"><option value="">All levels</option><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select></div><div id="fr" class="grid" style="margin-top:12px"></div>`;fx()},
road(){if(!S.p)return nope();const c=cur(),[d,n]=prog(c),w=Math.ceil(split(c).miss.length*25/S.p.hrs);$("#app").innerHTML=`<h2>My roadmap</h2>${sel("r","road")}<div class="card" style="margin-top:12px"><b>${d} of ${n} tasks complete</b>${bar(d,n)}<p class="mu">Rough estimate: about ${w} weeks for missing core skills at ${S.p.hrs} h/week (assuming ~25 h per skill). Your pace may differ.</p></div>${RM(c).map((a,i)=>`<div class="card" style="margin-top:12px"><h3>${ST[i]}</h3>${a.map((x,j)=>`<label class="tk" style="font-weight:400;margin:6px 0"><input type="checkbox" ${S.done[c.id+i+"_"+j]?"checked":""} onchange="tick('${c.id+i+"_"+j}',this.checked)"><span>${esc(x)}</span></label>`).join("")}</div>`).join("")}`},
gap(){if(!S.p)return nope();const c=cur(),s=split(c),o=c.o;$("#app").innerHTML=`<h2>Skill gap analysis</h2>${sel("g","gap")}<div class="card" style="margin-top:12px"><b>${s.got.length} of ${c.s.length} essential skills covered</b>${bar(s.got.length,c.s.length)}<h3>Strengths</h3>${chips(s.got,()=>"ok")}<h3>Missing essentials (learn in this order)</h3>${chips(s.miss.map((x,i)=>(i+1)+". "+x),()=>"no")}<h3>Optional advanced skills</h3>${chips(o,x=>has(x)?"ok":"")}<p class="mu">Rule: a skill counts as covered if your profile mentions it. Estimated time: ~${s.miss.length*25} hours in total (a rough guess).</p><button class="btn" onclick="go('chat');ask('Make a personalized action plan for becoming a ${c.n}. My missing skills: ${s.miss.join(", ")||"none"}.')">Ask mentor for a plan</button></div>`},
chat(){$("#app").innerHTML=`<h2>AI career mentor</h2><div id="msgs" class="msgs" aria-live="polite"></div><div>${["Which career fits my profile?","How do I become a machine learning engineer?","Data scientist vs AI engineer?","Review my resume structure","How should I prepare for interviews?"].map(q=>`<button class="chip" onclick="ask(this.textContent)">${q}</button>`).join("")}</div><div class="row" style="margin-top:8px;flex-wrap:nowrap"><input id="q" maxlength="500" aria-label="Your question" placeholder="Ask about careers, skills, resumes…" onkeydown="if(event.key==='Enter')ask()"><button class="btn" onclick="ask()">Send</button></div><p class="mu">AI can make mistakes. Verify salaries and links with official sources.</p>`;draw()}};

const F=[[["name","Full name (optional)","text"],["qual","Current qualification","sel",["Degree","B.Tech/B.E.","MCA","MBA","Other"],1],["course","Course / specialization","text",0,1],["year","Academic year","sel",["1st","2nd","3rd","4th","Graduated"],1],["loc","Country / preferred job location (optional)","text"]],[["int","Areas of interest","chips"],["skills","Existing skills, comma-separated","area"],["lvl","Experience level","sel",["Beginner","Intermediate","Advanced"],1]],[["target","Target job role","sel",[["","Not sure yet"]].concat(C.map(c=>[c.id,c.n]))],["style","Preferred learning style","sel",["Videos","Reading / docs","Hands-on projects","Mixed"]],["hrs","Weekly learning hours (1 to 60)","num",0,1],["goals","Career goals (optional)","area"]]];
let ob={step:0,d:S.p?{...S.p,skills:S.p.skills.join(", ")}:{int:[],hrs:8}};
function fld(f,d){const[id,l,t,o,r]=f,v=d[id]==null?"":d[id];let h=`<label for="${id}">${l}${r?" *":""}</label>`;if(t=="sel")h+=`<select id="${id}">${o.map(x=>{x=Array.isArray(x)?x:[x,x];return`<option value="${esc(x[0])}" ${v==x[0]?"selected":""}>${esc(x[1])}</option>`}).join("")}</select>`;else if(t=="chips")h=`<label>${l}</label>`+Object.keys(INT).map(k=>`<button type="button" class="chip ${d.int.includes(k)?"on":""}" aria-pressed="${d.int.includes(k)}" onclick="tg('${k}')">${INT[k]}</button>`).join("");else if(t=="area")h+=`<textarea id="${id}" rows="3" maxlength="300">${esc(v)}</textarea>`;else h+=`<input id="${id}" ${t=="num"?'type="number" min="1" max="60"':'type="text" maxlength="80"'} value="${esc(v)}">`;return h+`<div class="err" id="e_${id}"></div>`}
function tg(k){grab();const a=ob.d.int,i=a.indexOf(k);i<0?a.push(k):a.splice(i,1);V.onboard()}
function grab(){F[ob.step].forEach(f=>{const e=$("#"+f[0]);if(e)ob.d[f[0]]=e.value})}
function nextStep(n){grab();if(n>0){let ok=1;F[ob.step].forEach(f=>{const e=$("#e_"+f[0]);if(!e)return;let m="";const v=String(ob.d[f[0]]||"").trim();if(f[4]&&!v)m="Required";if(f[0]=="hrs"&&(v<1||v>60))m="Enter 1 to 60";e.textContent=m;if(m)ok=0});if(!ok)return;if(ob.step==2)return finish()}ob.step+=n;V.onboard();scrollTo(0,0)}
function finish(){const d=ob.d;S.p={name:String(d.name||"").trim(),qual:d.qual,course:d.course.trim(),year:d.year,loc:String(d.loc||"").trim(),int:d.int,skills:String(d.skills||"").split(",").map(x=>x.trim().toLowerCase()).filter(Boolean).map(x=>AL[x]||x).slice(0,40),lvl:d.lvl,target:d.target||"",style:d.style,hrs:+d.hrs,goals:String(d.goals||"").trim()};S.rc=S.p.target||null;save();ob.step=0;go("dash")}
function card(x){const c=x.c;return`<div class="card"><div class="row" style="justify-content:space-between"><b>${c.n}</b>${x.sc!=null?`<span class="chip on" title="Rule-based match score">${x.sc}</span>`:""}</div><p class="mu">${c.d}</p>${x.why?`<p style="font-size:14px">Why: ${x.why.join("; ")}.</p>`:""}<div class="row"><button class="btn g" onclick="info('${c.id}')">Details</button><button class="btn g" onclick="S.rc='${c.id}';go('road')">Roadmap</button></div></div>`}
function fx(){const q=$("#fq").value.toLowerCase(),c=$("#fc").value,l=$("#fl").value,r=C.filter(x=>(!c||x.c==c)&&(!l||x.l==l)&&(!q||(x.n+" "+x.s.join(" ")).toLowerCase().includes(q)));$("#fr").innerHTML=r.map(x=>card({c:x})).join("")||'<p class="mu">No careers match. Try fewer filters.</p>'}
function info(id){const c=C.find(x=>x.id==id),d=$("#dlg");d.innerHTML=`<h2>${c.n}</h2><p>${c.d}</p><p class="mu">${c.c} · ${c.l} level · Open to any degree if you build the skills; a CS/IT background helps for technical roles but is not the only route.</p><h3>Essential skills</h3>${chips(c.s,x=>S.p&&has(x)?"ok":"")}<h3>Optional advanced</h3>${chips(c.o,()=>"")}<h3>Entry-level titles</h3><p>${c.t.join(", ")}</p><h3>Example projects</h3><ul>${c.pr.map(x=>`<li>${x}</li>`).join("")}</ul><p class="mu">Salary: ranges vary by country, employer and experience, and this page has no live data. Ask the mentor and verify on current job boards. No outcome is guaranteed.</p><div class="row"><button class="btn" onclick="$('#dlg').close();S.rc='${c.id}';go('road')">Use this roadmap</button><button class="btn g" onclick="$('#dlg').close();go('chat');ask('Explain the ${c.n} career for me: roadmap, learning resources and salary range with caveats.')">Ask mentor</button><button class="btn g" onclick="$('#dlg').close()">Close</button></div>`;d.showModal()}
function tick(k,v){if(v)S.done[k]=1;else delete S.done[k];save();V.road()}

const md=t=>esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`(.+?)`/g,"<code>$1</code>").replace(/^#{1,3} (.+)$/gm,"<b>$1</b>").replace(/^[-*] (.+)$/gm,"• $1").replace(/\n/g,"<br>");
function draw(){const m=$("#msgs");if(!m)return;m.innerHTML=S.chat.length?S.chat.map(x=>`<div class="m ${x.r}">${x.r=="u"?esc(x.t):md(x.t)}</div>`).join(""):'<p class="mu">Pick a suggestion or type a question.</p>';m.scrollTop=m.scrollHeight}
const sys=()=>"You are AI Career Navigator, a friendly career mentor for students (Degree, B.Tech, MCA, MBA). Use simple language, explain jargon, give actionable next steps, and ask one clarifying question if needed. Separate facts from estimates. Never guarantee jobs or salaries. Never invent links, courses or certifications: name only official resources you are sure exist, otherwise say what to search for. Give salary ranges only as indicative, with country, currency and a note to verify, since you have no live job-market data. Do not invent the student’s qualifications or achievements. Keep answers under 250 words in Markdown. Student profile (name omitted): "+(S.p?JSON.stringify({qualification:S.p.qual,course:S.p.course,year:S.p.year,location:S.p.loc,interests:S.p.int.map(x=>INT[x]),skills:S.p.skills,level:S.p.lvl,hoursPerWeek:S.p.hrs,targetRole:(C.find(c=>c.id==S.p.target)||{}).n||"undecided",goals:S.p.goals}):"not provided yet; ask the student to complete the profile for better advice.");
async function ask(t){const i=$("#q");t=String(t||(i&&i.value)||"").trim().slice(0,500);if(!t||busy)return;if(i)i.value="";S.chat.push({r:"u",t},{r:"a",t:"Thinking…"});const L=S.chat[S.chat.length-1];busy=1;draw();
try{const sample=await claude.use("sample");if(!sample)throw{message:"The AI mentor isn’t available in this view. Open the page inside Claude to chat."};
const h=[];S.chat.slice(0,-1).filter(x=>x.r!="e").slice(-12).forEach(x=>{const r=x.r=="u"?"user":"assistant";if(h.length&&h[h.length-1].role==r)h[h.length-1].content+="\n"+x.t;else h.push({role:r,content:x.t})});while(h.length&&h[0].role!="user")h.shift();h[0].content=sys()+"\n\nConversation:\n"+h[0].content;
const res=await sample(h,{cache:false,onText:({text})=>{L.t=text;draw()}});L.t=res.text}
catch(e){L.r="e";L.t=e&&e.code=="rate_limited"?"Too many requests. Please wait a moment and try again.":e&&e.code=="not_granted"?"Permission to use AI was not granted.":(e&&e.message)||"Something went wrong. Please try again."}
busy=0;draw()}

function go(v){S.view=v;V[v]();scrollTo(0,0);$("#nav").innerHTML=`<b onclick="go('home')"><svg width="22" height="22" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="25" fill="none" stroke="#7c5cff" stroke-width="4"/><path d="M28 10l8 20-8 16-8-16z" fill="#5b5bf0"/></svg>Career Navigator</b>`+[["dash","Dashboard"],["explore","Careers"],["chat","Chat"],["road","Roadmap"],["gap","Skill gap"]].map(x=>`<a class="${v==x[0]?"on":""}" onclick="go('${x[0]}')">${x[1]}</a>`).join("")}
go("home");
</script></body></html>
